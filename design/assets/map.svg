<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#eef3f1"/>
  <!-- parks -->
  <rect x="40" y="60" width="300" height="220" rx="28" fill="#cfe8e2"/>
  <rect x="880" y="460" width="280" height="240" rx="28" fill="#cfe8e2"/>
  <!-- blocks -->
  <g fill="#ffffff">
    <rect x="400" y="60" width="220" height="150" rx="14"/>
    <rect x="680" y="60" width="180" height="150" rx="14"/>
    <rect x="40" y="340" width="300" height="140" rx="14"/>
    <rect x="400" y="270" width="220" height="200" rx="14"/>
    <rect x="680" y="270" width="180" height="200" rx="14"/>
    <rect x="40" y="540" width="300" height="160" rx="14"/>
    <rect x="400" y="530" width="220" height="170" rx="14"/>
    <rect x="680" y="530" width="180" height="170" rx="14"/>
    <rect x="920" y="60" width="240" height="150" rx="14"/>
    <rect x="920" y="270" width="240" height="140" rx="14"/>
  </g>
  <!-- roads -->
  <g stroke="#d9e2de" stroke-width="40" stroke-linecap="round" fill="none">
    <path d="M370 0 L 370 750"/>
    <path d="M650 0 L 650 750"/>
    <path d="M890 0 L 890 750"/>
    <path d="M0 240 L 1200 240"/>
    <path d="M0 500 L 1200 500"/>
  </g>
  <!-- Mt Holly Rd -->
  <path d="M0 240 L 1200 240" stroke="#9fd8cf" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M0 240 L 1200 240" stroke="#ffffff" stroke-width="4" stroke-dasharray="26 22" fill="none"/>
  <!-- road label -->
  <rect x="860" y="190" width="300" height="38" rx="19" fill="#ffffff"/>
  <text x="1010" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#116768">Mt Holly Rd</text>
  <!-- center building -->
  <rect x="470" y="300" width="100" height="90" rx="10" fill="#1a4566"/>
  <!-- pin -->
  <g transform="translate(520 300)">
    <circle cx="0" cy="18" r="22" fill="#1a4566" opacity="0.18"/>
    <path d="M0 -120 C -50 -120 -80 -82 -80 -40 C -80 10 0 20 0 20 C 0 20 80 10 80 -40 C 80 -82 50 -120 0 -120 Z" fill="#116768"/>
    <circle cx="0" cy="-46" r="30" fill="#ffffff"/>
    <circle cx="0" cy="-46" r="14" fill="#116768"/>
  </g>
</svg>

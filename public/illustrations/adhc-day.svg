<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- A structured day: a clock at the centre with morning, midday and afternoon
       arcs, and the day's moments around it (welcome tea, activities, lunch, music,
       exercise, rest). No people. -->
  <rect width="1200" height="900" fill="#e8f3f1"/>
  <circle cx="600" cy="450" r="400" fill="#dcefe9"/>

  <!-- dotted path joining the moments -->
  <circle cx="600" cy="450" r="320" fill="none" stroke="#9fd8cf" stroke-width="8" stroke-dasharray="4 22" stroke-linecap="round"/>

  <!-- clock -->
  <circle cx="600" cy="450" r="200" fill="#1a4566"/>
  <circle cx="600" cy="450" r="178" fill="#ffffff"/>
  <!-- parts of the day as arcs: morning amber, midday teal, afternoon mint -->
  <path d="M600 290 A 160 160 0 0 1 760 450" stroke="#f5b544" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M760 450 A 160 160 0 0 1 600 610" stroke="#116768" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M600 610 A 160 160 0 0 1 440 450" stroke="#9fd8cf" stroke-width="22" fill="none" stroke-linecap="round"/>
  <g fill="#1a4566">
    <circle cx="600" cy="318" r="7"/><circle cx="732" cy="450" r="7"/>
    <circle cx="600" cy="582" r="7"/><circle cx="468" cy="450" r="7"/>
  </g>
  <rect x="594" y="360" width="12" height="96" rx="6" fill="#1a4566"/>
  <rect x="594" y="400" width="12" height="76" rx="6" fill="#116768" transform="rotate(120 600 450)"/>
  <circle cx="600" cy="450" r="16" fill="#f5b544"/>
  <!-- heart at the top of the clock -->
  <path d="M600 222 c -14 -28 -54 -11 -36 19 c 9 14 36 34 36 34 c 0 0 27 -20 36 -34 c 18 -30 -22 -47 -36 -19 z" fill="#116768"/>

  <!-- moments around the day, each on a white disc -->
  <!-- top right: welcome tea and sunrise -->
  <g transform="translate(900 190)">
    <circle r="96" fill="#ffffff"/>
    <circle cx="0" cy="-10" r="34" fill="#f5b544"/>
    <rect x="-70" y="-6" width="140" height="70" fill="#ffffff"/>
    <rect x="-38" y="0" width="64" height="48" rx="12" fill="#116768"/>
    <rect x="22" y="10" width="22" height="20" rx="10" fill="none" stroke="#116768" stroke-width="7"/>
    <ellipse cx="-6" cy="52" rx="52" ry="9" fill="#9fd8cf"/>
  </g>
  <!-- right: activities (palette and brush) -->
  <g transform="translate(1000 520)">
    <circle r="96" fill="#ffffff"/>
    <path d="M-50 -10 C -50 -50, 40 -60, 52 -16 C 60 14, 30 18, 20 30 C 10 44, 26 56, -2 56 C -40 56, -50 26, -50 -10 Z" fill="#e9e2d4"/>
    <circle cx="-22" cy="-20" r="11" fill="#f5b544"/>
    <circle cx="12" cy="-28" r="11" fill="#116768"/>
    <circle cx="34" cy="-6" r="11" fill="#1a4566"/>
    <circle cx="-28" cy="16" r="11" fill="#9fd8cf"/>
    <rect x="10" y="-60" width="10" height="70" rx="5" fill="#8a6f4e" transform="rotate(40 15 -25)"/>
  </g>
  <!-- bottom right: lunch -->
  <g transform="translate(820 790)">
    <circle r="96" fill="#ffffff"/>
    <circle r="56" fill="#f6f3ec" stroke="#d6cfc0" stroke-width="5"/>
    <circle cx="-18" cy="-8" r="18" fill="#f5b544"/>
    <circle cx="18" cy="-14" r="14" fill="#116768"/>
    <rect x="-20" y="14" width="44" height="16" rx="8" fill="#5fb3a5"/>
    <rect x="70" y="-40" width="8" height="76" rx="4" fill="#9aa5b1"/>
  </g>
  <!-- bottom left: music -->
  <g transform="translate(380 790)">
    <circle r="96" fill="#ffffff"/>
    <path d="M-20 30 l 0 -60 l 50 -12 l 0 54" stroke="#1a4566" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-30" cy="32" r="16" fill="#1a4566"/>
    <circle cx="20" cy="20" r="16" fill="#1a4566"/>
  </g>
  <!-- left (9 o'clock): exercise, a dumbbell -->
  <g transform="translate(200 520)">
    <circle r="96" fill="#ffffff"/>
    <g transform="rotate(-24)">
      <rect x="-46" y="-8" width="92" height="16" rx="8" fill="#1a4566"/>
      <rect x="-70" y="-34" width="24" height="68" rx="10" fill="#116768"/>
      <rect x="-86" y="-24" width="18" height="48" rx="8" fill="#5fb3a5"/>
      <rect x="46" y="-34" width="24" height="68" rx="10" fill="#116768"/>
      <rect x="68" y="-24" width="18" height="48" rx="8" fill="#5fb3a5"/>
    </g>
  </g>
  <!-- top left: rest (armchair and blanket) -->
  <g transform="translate(300 190)">
    <circle r="96" fill="#ffffff"/>
    <rect x="-52" y="-30" width="104" height="58" rx="16" fill="#116768"/>
    <rect x="-66" y="0" width="30" height="50" rx="12" fill="#116768"/>
    <rect x="36" y="0" width="30" height="50" rx="12" fill="#116768"/>
    <rect x="-36" y="10" width="72" height="30" rx="8" fill="#5fb3a5"/>
    <rect x="-10" y="-24" width="40" height="44" rx="6" fill="#f5b544" transform="rotate(10 10 -2)"/>
    <rect x="-50" y="48" width="8" height="16" fill="#1a4566"/><rect x="42" y="48" width="8" height="16" fill="#1a4566"/>
  </g>
</svg>

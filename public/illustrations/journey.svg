    <rect x="20" y="60" width="90" height="60" rx="10" fill="#cfe8e2"/>
    <rect x="130" y="60" width="90" height="60" rx="10" fill="#cfe8e2"/>
    <rect x="240" y="60" width="80" height="60" rx="10" fill="#cfe8e2"/>
    <rect x="340" y="80" width="60" height="46" rx="8" fill="#cfe8e2"/>
    <rect x="0" y="130" width="430" height="16" fill="#9fd8cf"/>

    <ellipse cx="110" cy="48" rx="34" ry="18" fill="#116768"/>
    <ellipse cx="175" cy="40" rx="30" ry="14" fill="#f5b544"/>
    <ellipse cx="190" cy="62" rx="28" ry="12" fill="#9fd8cf"/>
    <rect x="280" y="20" width="10" height="60" rx="5" fill="#9aa5b1"/>
    <rect x="30" y="20" width="10" height="60" rx="5" fill="#9aa5b1"/>

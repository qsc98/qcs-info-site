    <rect x="1330" y="536" width="222" height="50" rx="9" fill="#116768" stroke="#ffffff" stroke-width="4"/>
    <text x="1441" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="1.5" fill="#ffffff">MT HOLLY RD</text>
    <rect x="1146" y="648" width="10" height="90" rx="3" fill="#8a6f4e"/>
    <path d="M1106 652 L 1106 622 A 24 24 0 0 1 1130 598 L 1172 598 A 24 24 0 0 1 1196 622 L 1196 652 Z" fill="#f6f3ec" stroke="#1f2937" stroke-width="3"/>

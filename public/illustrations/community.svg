  <circle cx="1040" cy="140" r="58" fill="#f5b544"/>
  <rect x="120" y="110" width="170" height="44" rx="22" fill="#ffffff"/>
  <rect x="170" y="86" width="90" height="44" rx="22" fill="#ffffff"/>
  <rect x="800" y="210" width="140" height="38" rx="19" fill="#ffffff" opacity="0.85"/>


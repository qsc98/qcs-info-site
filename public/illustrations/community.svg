  <path d="M600 470 C 360 340, 360 110, 500 100 C 560 96, 590 130, 600 160 C 610 130, 640 96, 700 100 C 840 110, 840 340, 600 470 Z" fill="#116768"/>
  <path d="M600 410 C 430 320, 430 160, 520 150 C 565 146, 590 175, 600 205 C 610 175, 635 146, 680 150 C 770 160, 770 320, 600 410 Z" fill="#5fb3a5"/>
  <g fill="#f5b544">
    <circle cx="520" cy="230" r="14"/>
    <circle cx="672" cy="210" r="14"/>
    <circle cx="610" cy="300" r="14"/>
    <circle cx="545" cy="320" r="11"/>
    <circle cx="690" cy="300" r="11"/>
  </g>
  <g fill="#9fd8cf">
    <circle cx="470" cy="180" r="10"/>
    <circle cx="740" cy="190" r="10"/>
  </g>

  <!-- bench under the tree, bushes and flowers -->
  <g>
    <rect x="660" y="556" width="120" height="14" rx="6" fill="#1a4566"/>
    <rect x="660" y="530" width="120" height="12" rx="6" fill="#116768"/>
    <rect x="670" y="568" width="10" height="36" fill="#1a4566"/>
    <rect x="760" y="568" width="10" height="36" fill="#1a4566"/>

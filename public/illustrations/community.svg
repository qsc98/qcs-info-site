    <rect x="818" y="336" width="314" height="26" rx="6" fill="#116768"/>
    <rect x="856" y="392" width="70" height="62" rx="6" fill="#cfe8e2"/>
    <rect x="1024" y="392" width="70" height="62" rx="6" fill="#fff5d6"/>

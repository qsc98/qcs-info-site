  <path d="M960 840 c -8 -16 -32 -6 -21 11 c 6 8 21 20 21 20 c 0 0 15 -12 21 -20 c 11 -17 -13 -27 -21 -11 z" fill="#f5b544"/>
  <path d="M590 860 c -7 -14 -28 -5 -18 10 c 5 7 18 17 18 17 c 0 0 13 -10 18 -17 c 10 -15 -11 -24 -18 -10 z" fill="#1a4566"/>


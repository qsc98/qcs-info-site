  <circle cx="420" cy="590" r="34" fill="#5fb3a5"/>
  <circle cx="455" cy="598" r="26" fill="#116768"/>
  <circle cx="800" cy="590" r="28" fill="#5fb3a5"/>
  <circle cx="60" cy="560" r="50" fill="#5fb3a5"/><rect x="54" y="590" width="12" height="40" fill="#8a6f4e"/>
  <circle cx="1160" cy="540" r="54" fill="#116768"/><rect x="1154" y="570" width="12" height="50" fill="#8a6f4e"/>
  <g>
    <circle cx="520" cy="600" r="8" fill="#f5b544"/>
    <circle cx="540" cy="606" r="7" fill="#ffffff"/>
    <circle cx="880" cy="598" r="8" fill="#f5b544"/>
    <circle cx="860" cy="604" r="7" fill="#ffffff"/>
